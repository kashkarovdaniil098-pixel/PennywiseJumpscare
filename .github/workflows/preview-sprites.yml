name: Preview Pennywise Uploaded Frames

on:
  workflow_dispatch:
  push:
    paths:
      - "PennywiseNPC/assets/*.png"
      - "tools/assemble_uploaded_frames.py"
      - "tools/build_walking_sprite.py"
      - ".github/workflows/preview-sprites.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and build candidate
        run: |
          python -m pip install --quiet pillow
          python tools/assemble_uploaded_frames.py
          python tools/build_walking_sprite.py
      - uses: actions/upload-artifact@v4
        with:
          name: PennywiseAll27Frames
          path: |
            sprite-preview/
            PennywiseNPC/assets/sprites_candidate.png
          if-no-files-found: error
