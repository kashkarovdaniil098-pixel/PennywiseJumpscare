name: Build Pennywise Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build SMAPI mod
        run: dotnet build PennywiseJumpscare.csproj -c Release

      - name: Assemble mod folders
        run: |
          mkdir -p dist/PennywiseJumpscare
          mkdir -p "dist/[CP] Pennywise NPC"

          cp manifest.json dist/PennywiseJumpscare/manifest.json

          DLL=$(find bin/Release -type f -name 'PennywiseJumpscare.dll' | head -n 1)
          test -n "$DLL"
          cp "$DLL" dist/PennywiseJumpscare/
          cp jumpscare.png dist/PennywiseJumpscare/
          cp animations.png dist/PennywiseJumpscare/
          cp animations.png PennywiseNPC/assets/animations.png

          cp -R PennywiseNPC/. "dist/[CP] Pennywise NPC/"

          # Generate the original suspense loop with a standalone Python script.
          python generate_suspense.py
          test -s dist/PennywiseJumpscare/suspense.wav

          cd dist
          zip -r ../PennywiseMod.zip PennywiseJumpscare "[CP] Pennywise NPC"

      - uses: actions/upload-artifact@v4
        with:
          name: PennywiseMod
          path: PennywiseMod.zip
          if-no-files-found: error
