name: Build Pennywise Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build and use the new Pennywise walking sprite
        run: |
          python -m pip install --quiet pillow
          python tools/build_walking_sprite.py
          cp PennywiseNPC/assets/sprites_candidate.png PennywiseNPC/assets/sprites.png

      - name: Build SMAPI mod
        run: dotnet build PennywiseJumpscare.csproj -c Release

      - name: Assemble mod folders
        run: |
          mkdir -p dist/PennywiseJumpscare
          mkdir -p "dist/[CP] Pennywise NPC"

          cp manifest.json dist/PennywiseJumpscare/manifest.json

          DLL=$(find bin/Release -type f -name 'PennywiseJumpscare.dll' | head -n 1)
          test -n "$DLL"
          cp "$DLL" dist/PennywiseJumpscare/

          cp -R PennywiseNPC/. "dist/[CP] Pennywise NPC/"

          # Generate an original, seamless 8-second suspense drone (no external music).
          python - <<'PY'
          import math, wave, struct
          rate = 22050
          seconds = 8
          with wave.open("dist/PennywiseJumpscare/suspense.wav", "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for n in range(rate * seconds):
                  t = n / rate
                  # Integer-cycle tones and a looping slow pulse keep the loop smooth.
                  pulse = 0.72 + 0.28 * math.sin(2 * math.pi * t / seconds) ** 2
                  sample = pulse * (
                      0.20 * math.sin(2 * math.pi * 55 * t) +
                      0.12 * math.sin(2 * math.pi * 73 * t) +
                      0.07 * math.sin(2 * math.pi * 110 * t) +
                      0.035 * math.sin(2 * math.pi * 146 * t)
                  )
                  frames += struct.pack("<h", int(max(-1, min(1, sample)) * 32767))
              out.writeframes(frames)

          cd dist
          zip -r ../PennywiseMod.zip PennywiseJumpscare "[CP] Pennywise NPC"

      - uses: actions/upload-artifact@v4
        with:
          name: PennywiseMod
          path: PennywiseMod.zip
          if-no-files-found: error
