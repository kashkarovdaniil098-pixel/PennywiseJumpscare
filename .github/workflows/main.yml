

name: Build PennywiseJumpscare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Add game references
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build
        run: dotnet build PennywiseJumpscare.csproj -c Release

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PennywiseJumpscare
          path: bin/Release/**/*.zip
